services:
  mc-server:
    image: ${IMAGE_NAME}:${MC_VERSION}
    pull_policy: never
    build:
      target: minecraft-server
      dockerfile: scripts/Dockerfile.glibc
      sbom: true
      provenance: mode=max
      args:
        - JAVA_VERSION=${JAVA_VERSION}
        - SERVER_LINK=${SERVER_LINK}
        # - MINECRAFT_EULA=TRUE # By uncommenting this, you agree to Minecraft's EULA when running the standalone built image.
    stdin_open: true
    user: ${UID:-65532}:${GID:-65532}
    working_dir: /mnt/server-files/${UID:-65532}_${GID:-65532}
    volumes:
      - ./out:/mnt/server-files/${UID:-65532}_${GID:-65532}
      #- ./server.jar:/home/server.jar
    tty: true
    ports:
      - "25565:25565"
    command: -Xmx1024M -Xms1024M -jar /home/server.jar --nogui
